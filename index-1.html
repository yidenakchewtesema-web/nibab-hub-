<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nibab Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#16a34a;--gd:#15803d;--gl:#dcfce7;--bg:#fff;--t:#14231a;--m:#6b7a70;--line:#e8efe9}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans Ethiopic',system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;flex-direction:column;max-width:560px;margin:auto}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 2px 8px rgba(22,101,52,.25);cursor:pointer}
header h1{font-size:20px;color:var(--gd)}
header small{display:block;color:var(--m);font-size:12px}
main{flex:1;overflow-y:auto;padding:0 18px 16px}
.sec{display:none}.sec.on{display:block}
input,select,button{font:inherit}
.search{width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:14px;outline:none;background:#f7faf8}
.search:focus,.in:focus{border-color:var(--g)}
.chips{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.chip{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--m);white-space:nowrap;cursor:pointer;font-size:14px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.book{cursor:pointer}
.cover{aspect-ratio:3/4;border-radius:12px;padding:14px 12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 16px rgba(22,101,52,.18);font-weight:700;line-height:1.3}
.cover span{font-size:11px;font-weight:400;opacity:.85}
.book h3{font-size:14px;margin-top:8px}
.book p{font-size:12px;color:var(--m)}
.tag{display:inline-block;margin-top:4px;font-size:11px;background:var(--gl);color:var(--gd);padding:2px 8px;border-radius:99px}
.empty{text-align:center;color:var(--m);padding:40px 0}
/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0}
.m{max-width:80%;padding:9px 13px;border-radius:16px;background:#f1f5f2;font-size:14px;word-wrap:break-word}
.m b{display:block;font-size:11px;color:var(--gd);margin-bottom:2px}
.m.me{align-self:flex-end;background:var(--g);color:#fff;border-bottom-right-radius:4px}
.m.me b{color:#d1fae5}
.m:not(.me){border-bottom-left-radius:4px}
.m i{display:block;font-size:10px;opacity:.6;margin-top:3px;font-style:normal;text-align:right}
.bar{display:flex;gap:8px;padding-top:8px}
.in{flex:1;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;outline:none;min-width:0}
.send{background:var(--g);color:#fff;border:0;border-radius:14px;padding:0 18px;font-weight:700}
.row{display:flex;gap:8px;margin-bottom:6px}
.row select,.row input{flex:1;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-width:0;font-size:13px}
/* nav */
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:#fff}
nav button{flex:1;padding:10px 0 8px;border:0;background:none;color:var(--m);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--g);font-weight:700}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* reader */
#reader{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:9;max-width:560px;margin:auto}
#reader.on{display:flex}
.rh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--g);color:#fff}
.rh button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;width:36px;height:36px;font-size:18px}
.rh div{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#frame{flex:1;border:0;width:100%}
.pick{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;color:var(--m)}
.btn{background:var(--g);color:#fff;padding:12px 22px;border-radius:14px;font-weight:700;cursor:pointer;border:0}
[hidden]{display:none!important}
#admin{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;z-index:10;max-width:560px;margin:auto}
#admin.on{display:flex}
.ab{padding:18px;overflow-y:auto}
#agate,#alogin,#apanel{display:flex;flex-direction:column;gap:10px}
.ab h3{color:var(--gd);font-size:16px;margin-top:6px}
.ab input,.ab select{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:#fff}
.ai{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ai span{flex:1}
.note{background:#fef9c3;color:#854d0e;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.ai button{border:0;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:6px 12px}
html{background:#fff;overscroll-behavior:none;color-scheme:light}
@supports(height:100dvh){html,body{height:100dvh}}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,select,textarea,.m{-webkit-user-select:text;user-select:text}
main,.msgs,.ab{scrollbar-width:none}
main::-webkit-scrollbar,.msgs::-webkit-scrollbar,.ab::-webkit-scrollbar{display:none}
.sec.chat{display:none}.sec.chat.on{display:flex}
img.cover{display:block;width:100%;object-fit:cover;padding:0}
.cv{position:relative;display:flex;align-items:center;justify-content:center;width:150px;aspect-ratio:3/4;border:1.5px dashed var(--g);border-radius:12px;overflow:hidden;color:var(--gd);font-size:13px;text-align:center;background:var(--gl);cursor:pointer}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#splash{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.ring{position:relative;width:128px;height:128px}
.ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--g);opacity:0;animation:rip 2s ease-out infinite}
.ring::after{animation-delay:.9s}
.ring img{position:relative;width:128px;height:128px;border-radius:50%;box-shadow:0 8px 24px rgba(22,101,52,.3);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
#splash h2{color:var(--gd);font-size:24px;animation:up .7s .5s both}
#splash p{color:var(--m);font-size:13px;margin-top:-8px;animation:up .7s .7s both}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes rip{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.7);opacity:0}}
</style>
</head>

<main>
  <!-- Library -->
  <section id="lib" class="sec on">
    <input class="search" id="q" placeholder="መጽሐፍ ወይም ደራሲ ይፈልጉ...">
    <div class="chips" id="chips">

      <div class="chip" data-f="tr">የተተረጎሙ</div>
      <div class="chip" data-f="lo">የሀገር ውስጥ</div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- Chat -->
  <section id="cht" class="sec chat">
    <div class="row">
      <input id="name" placeholder="ስምዎ" maxlength="20">
      <select id="room"></select>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="bar">
      <input class="in" id="txt" placeholder="አስተያየትዎን ይጻፉ...">
      <button class="send" id="send">ላክ</button>
    </div>
  </section>
</main>

<nav>
  <button class="on" data-s="lib"><svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/></svg>መጻሕፍት</button>
  <button data-s="cht"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>ውይይት</button>

    <div style="font-size:42px">📖</div>
    <p>ለዚህ መጽሐፍ የፒዲኤፍ ፋይል አልተገናኘም።<br>ከስልክዎ ፒዲኤፍ መርጠው ማንበብ ይችላሉ።</p>

  </div>
</div>

      <div id="alist"></div>
      <button class="chip" id="aout">ውጣ</button>
    </div>
  </div>
</div>

let BOOKS=[];

    <h3>${b.title}</h3><p>${b.author}</p>
    <span class="tag">${b.type==="tr"?"የተተረጎመ":"የሀገር ውስጥ"}</span>
   </div>`}).join(""):`<div class="empty" style="grid-column:1/-1">ምንም መጽሐፍ አልተገኘም</div>`;
  $$(".book").forEach(e=>e.onclick=()=>openBook(e.dataset.id));
}
$("#q").oninput=render;
$$(".chip").forEach(c=>c.onclick=()=>{
  filter=c.dataset.f;
  $$(".chip").forEach(x=>x.classList.toggle("on",x===c));render();
});

/* PDF Reader */
function openBook(id){
  const b=BOOKS.find(x=>x.id==id);
  $("#rt").textContent=b.title;
  show(b.pdf||"");
  $("#reader").classList.add("on");
}
function show(url){
  $("#frame").hidden=!url;$("#pick").style.display=url?"none":"flex";
  $("#frame").src=url?fix(url):"about:blank";
}
$("#file").onchange=e=>{const f=e.target.files[0];if(f)show(URL.createObjectURL(f))};
$("#back").onclick=()=>{$("#reader").classList.remove("on");$("#frame").src="about:blank"};

/* Chat */
function buildRooms(){
  const s=$("#room"),cur=s.value;s.innerHTML="";
  ["ጠቅላላ ውይይት",...BOOKS.map(b=>b.title)].forEach(r=>{const o=document.createElement("option");o.textContent=r;s.appendChild(o)});
  if(cur)s.value=cur;if(!s.value)s.selectedIndex=0;
}
buildRooms();
let msgs=[];
try{msgs=JSON.parse(localStorage.getItem("nh_msgs")||"[]")}catch(e){}
if(!msgs.length)msgs=[
 {room:"ጠቅላላ ውይይት",user:"ሰላም",text:"እንኳን ወደ Nibab Hub በደህና መጡ! 📚",t:Date.now()-6e5},
 {room:"ጠቅላላ ውይይት",user:"ብሩክ",text:"ፍቅር እስከ መቃብርን ዛሬ ጀመርኩ፣ ድንቅ ነው።",t:Date.now()-3e5}];
let me="";try{me=localStorage.getItem("nh_name")||""}catch(e){}
$("#name").value=me;
const save=()=>{try{localStorage.setItem("nh_msgs",JSON.stringify(msgs.slice(-200)))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function draw(){
  const r=$("#room").value;
  const l=msgs.filter(m=>m.room===r);
  $("#msgs").innerHTML=l.length?l.map(m=>{
    const d=new Date(m.t),t=d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
    return `<div class="m ${m.user===$("#name").value.trim()?"me":""}"><b>${esc(m.user)}</b>${esc(m.text)}<i>${t}</i></div>`}).join("")
   :`<div class="empty">ገና መልዕክት የለም። የመጀመሪያው ይሁኑ!</div>`;
  scrollDown();
}
function scrollDown(){const e=$("#msgs");setTimeout(()=>e.scrollTop=e.scrollHeight,0)}
function send(){
  const text=$("#txt").value.trim(),user=$("#name").value.trim();
  if(!user){$("#name").focus();return}
  if(!text)return;
  try{localStorage.setItem("nh_name",user)}catch(e){}
  const msg={room:$("#room").value,user,text:text.slice(0,500),t:Date.now()};
  $("#txt").value="";
  if(db){F.addDoc(F.collection(db,"messages"),msg).catch(()=>alert("መልዕክቱ አልተላከም። ኢንተርኔትዎን ያረጋግጡ።"));}
  else{msgs.push(msg);save();draw();}
}
$("#send").onclick=send;
$("#txt").onkeydown=e=>{if(e.key==="Enter")send()};
$("#room").onchange=draw;
$("#name").oninput=draw;

/* ═══ Firebase (modular SDK v10.12.2 — ከ CDN በ dynamic import) ═══ */
let db=null,auth=null,store=null,F=null,fbStatus="",dbState="በመገናኘት ላይ...";
const CDN="https://www.gstatic.com/firebasejs/10.12.2/";
async function initFirebase(){
  if(/YOUR_/.test(FIREBASE_CONFIG.apiKey+FIREBASE_CONFIG.projectId)){fbStatus="config";dbState="❌ FIREBASE_CONFIG አልተሞላም";console.warn("FIREBASE_CONFIG አልተሞላም");return}
  try{
    const m=await Promise.all(["app","firestore","auth","storage"].map(n=>import(CDN+"firebase-"+n+".js")));
    F=Object.assign({},...m);
    const app=F.initializeApp(FIREBASE_CONFIG);
    db=F.getFirestore(app);auth=F.getAuth(app);store=F.getStorage(app);
    msgs=[];
    F.onSnapshot(F.query(F.collection(db,"messages"),F.orderBy("t"),F.limitToLast(300)),
      s=>{msgs=s.docs.map(d=>d.data());draw()},e=>console.warn("messages:",e.code));
    F.onSnapshot(F.query(F.collection(db,"books"),F.orderBy("createdAt","desc")),
      s=>{dbState="✅ ተገናኝቷል — "+s.size+" መጻሕፍት በ Firestore ውስጥ";BOOKS=s.docs.map(d=>({id:d.id,...d.data()}));render();buildRooms();adminView();draw()},
      e=>{console.warn("books:",e.code,e.message);dbState="❌ "+(e.code||"")+" — "+(e.message||"");adminView();$("#grid").innerHTML='<div class="empty" style="grid-column:1/-1">መጻሕፍትን መጫን አልተቻለም ('+E(e.code||"error")+')</div>'});
    F.onAuthStateChanged(auth,()=>adminView());
  }catch(e){dbState="❌ "+e.message;fbStatus="error: "+e.message;db=auth=store=F=null;console.warn("Firebase አልተገናኘም:",e.message)}
}

/* Admin Panel — ሎጎውን 5 ጊዜ ይንኩ */
let taps=0,tapT,unlocked=false,needLogin=false;
$("#logo").onclick=()=>{
  taps++;clearTimeout(tapT);tapT=setTimeout(()=>taps=0,1500);
  if(taps>=5){taps=0;unlocked=false;$("#admin").classList.add("on");adminView();setTimeout(()=>$("#agpw").focus(),80)}
};
function adminView(){
  const u=auth&&auth.currentUser;
  $("#agate").hidden=unlocked;
  $("#apanel").hidden=!unlocked;
  $("#astat").textContent="Firebase: "+dbState;
  $("#alogin").hidden=!unlocked||!needLogin||!!u;
  renderAdminList();
}
function renderAdminList(){
  $("#alist").innerHTML=BOOKS.map(b=>`<div class="ai"><span>${E(b.title)}</span><button data-d="${b.id}">ሰርዝ</button></div>`).join("")||'<p class="empty">ባዶ ነው</p>';
}
const needAuth=e=>e&&/permission-denied|unauthorized|unauthenticated/.test(e.code||"");
function authPrompt(){needLogin=true;adminView();alert("ፈቃድ የለም — ከላይ በ Firebase መለያዎ ይግቡ")}
$("#aclose").onclick=()=>{unlocked=false;$("#agpw").value="";$("#admin").classList.remove("on")};
$("#alogbtn").onclick=()=>{
  if(!auth){alert("Firebase አልተገናኘም — ኢንተርኔትዎን ያረጋግጡ");return}
  F.signInWithEmailAndPassword(auth,$("#aem").value.trim(),$("#apw").value)
    .then(()=>{needLogin=false;adminView()}).catch(()=>alert("ኢሜይል ወይም ይለፍ ቃል ትክክል አይደለም"));
};
$("#aout").onclick=()=>{unlocked=false;needLogin=false;if(auth&&F)F.signOut(auth);$("#admin").classList.remove("on")};

/* የይለፍ ቃል በር */
function tryGate(){
  if($("#agpw").value===ADMIN_PW){unlocked=true;$("#agpw").value="";$("#agerr").hidden=true;adminView()}
  else{$("#agerr").hidden=false;$("#agpw").value=""}
}
$("#agbtn").onclick=tryGate;
$("#agpw").onkeydown=e=>{if(e.key==="Enter")tryGate()};

/* የሽፋን ፎቶ — መረጣ እና መጭመቅ (ወደ 360×480 JPEG፤ በ Firestore ውስጥ ይቀመጣል) */
$("#acover").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=$("#aprev");im.src=URL.createObjectURL(f);im.style.display="block";$("#aprevt").style.display="none";
};
function toCover(file){
  return new Promise((ok,no)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const W=360,H=480,c=document.createElement("canvas");c.width=W;c.height=H;
      const x=c.getContext("2d"),r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;
      x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
      URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.82));
    };
    img.onerror=()=>no(new Error("img"));img.src=u;
  });
}

/* መጽሐፍ መጨመር — ሽፋን (ፎቶ ወይም ሊንክ) + ፒዲኤፍ (ሊንክ ወይም ፋይል) */
let busy=false;
const isUrl=u=>/^https?:\/\//i.test(u);
$("#aadd").onclick=async()=>{
  if(busy)return;
  if(!db){alert("Firebase አልተገናኘም — ኢንተርኔትዎን ያረጋግጡ");return}
  const title=$("#atitle").value.trim(),author=$("#aauthor").value.trim();
  const cf=$("#acover").files[0],cu=$("#acoverurl").value.trim();
  const pf=$("#apdf").files[0],pu=$("#apdfurl").value.trim(),prog=$("#aprog");
  if(!title||!author){alert("ርዕስ እና የደራሲ ስም ያስገቡ");return}
  if(!pf&&!pu){alert("የፒዲኤፍ ሊንክ ያስገቡ ወይም ፋይል ይምረጡ");return}
  if(pu&&!isUrl(pu)){alert("የፒዲኤፍ ሊንክ በ https:// መጀመር አለበት");return}
  if(cu&&!isUrl(cu)){alert("የሽፋን ሊንክ በ https:// መጀመር አለበት");return}
  if(pf&&pf.size>50*1024*1024){alert("ፋይሉ ከ50MB መብለጥ የለበትም");return}
  busy=true;$("#aadd").disabled=true;
  try{
    const nb={title,author,type:$("#atype").value,createdAt:Date.now(),c:[["#16a34a","#14532d"],["#059669","#064e3b"],["#65a30d","#365314"],["#10b981","#065f46"]][Math.floor(Math.random()*4)]};
    if(cf){prog.textContent="ሽፋን በማዘጋጀት ላይ...";nb.cover=await toCover(cf)}
    else if(cu)nb.coverUrl=cu;
    if(pf){
      const path="books/"+Date.now()+"_"+pf.name.replace(/[^\w.\-]/g,"_"),r=F.ref(store,path),task=F.uploadBytesResumable(r,pf);
      task.on("state_changed",x=>{prog.textContent="በመጫን ላይ... "+Math.round(x.bytesTransferred/x.totalBytes*100)+"%"});
      await task;nb.pdf=await F.getDownloadURL(r);nb.pdfPath=path;
    }else nb.pdf=pu;
    await F.addDoc(F.collection(db,"books"),nb);
    ["#atitle","#aauthor","#acoverurl","#apdfurl"].forEach(i=>$(i).value="");$("#apdf").value="";$("#acover").value="";
    $("#aprev").style.display="none";$("#aprevt").style.display="";
    alert("✅ ተጨምሯል");
  }catch(e){
    if(needAuth(e))authPrompt();else alert("መጨመር አልተቻለም\n"+(e.code||"")+"\n"+(e.message||""));
  }
  busy=false;$("#aadd").disabled=false;prog.textContent="";
};

/* መሰረዝ */
$("#alist").onclick=e=>{
  const id=e.target.dataset.d;
  if(!id||!db||!confirm("ይህ መጽሐፍ ይሰረዝ?"))return;
  const bk=BOOKS.find(b=>b.id==id);
  F.deleteDoc(F.doc(db,"books",id))
    .then(()=>{if(bk&&bk.pdfPath)F.deleteObject(F.ref(store,bk.pdfPath)).catch(()=>{})})
    .catch(e=>{if(needAuth(e))authPrompt();else alert("መሰረዝ አልተቻለም")});
};

/* Splash — ሎጎው ከአኒሜሽን በኋላ በ Header ላይ ይቀራል */
(function(){
  const sp=$("#splash");$("#splashLogo").src=$("#logo").src;
  setTimeout(()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),600)},2200);
})();

render();draw();
initFirebase();
</script>
